<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ビンゴ5予報</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f7;--ink:#121826;--mute:#667085;--card:#fff;--line:#d9dfec;--blue:#2f5bea;--red:#e5484d;--yel:#f2b705;--sub:#8a94a8}
@media(prefers-color-scheme:dark){:root{--bg:#0f1420;--ink:#eef1f7;--mute:#98a2b8;--card:#1a2133;--line:#2c3550}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.6 "M PLUS Rounded 1c",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;font-weight:800;margin:8px 0 2px}
h2{font-size:1rem;font-weight:800;margin:28px 0 8px}
.sub{color:var(--mute);font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
input,textarea,button{font:inherit;color:inherit}
input,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin:6px 0}
button{border:0;border-radius:10px;padding:10px 16px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.seg{display:flex;gap:6px;margin:14px 0}
.seg button{flex:1;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{border:3px solid var(--sub);border-radius:16px;background:var(--card);text-align:center;padding:10px 4px 8px}
.cell.strong{border-color:var(--blue)}.cell.missing{border-color:var(--red)}.cell.neighbor{border-color:var(--yel)}
.ball{font-size:2.2rem;font-weight:800;line-height:1.1}
.cell small{display:block;color:var(--mute);font-size:.72rem}
.free{display:flex;flex-direction:column;justify-content:center;border:3px dashed var(--line);border-radius:16px;text-align:center;color:var(--mute)}
.free b{font-size:1.1rem;color:var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:10px 2px;font-size:.8rem;color:var(--mute)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.meter{height:12px;background:var(--line);border-radius:6px;position:relative;margin:8px 0 4px}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--blue);border-radius:6px}
.meter u{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--red)}
table{width:100%;border-collapse:collapse;font-size:.85rem}
td,th{padding:6px 4px;text-align:right;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left}
svg{width:100%;height:auto;display:block}svg text{fill:var(--mute);font-size:9px}
.err{color:var(--red);min-height:1.4em}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<section id="login" class="card" hidden>
  <h1>ビンゴ5予報</h1>
  <p class="sub">ID とパスワードでログインします。</p>
  <label>ID<input id="uid" autocomplete="username"></label>
  <label>パスワード<input id="upw" type="password" autocomplete="current-password"></label>
  <p class="err" id="lerr" role="alert"></p>
  <button id="lbtn">ログイン</button>
</section>

<section id="app" hidden>
  <h1 id="title">ビンゴ5予報</h1>
  <p class="sub" id="meta"></p>
  <div class="seg" id="seg" role="group" aria-label="モード">
    <button data-m="stable">安定型</button><button data-m="balanced">バランス型</button><button data-m="explosive">爆発型</button>
  </div>
  <div class="board" id="board"></div>
  <div class="legend">
    <span><i class="dot" style="background:var(--blue)"></i>強数字</span>
    <span><i class="dot" style="background:var(--red)"></i>未出</span>
    <span><i class="dot" style="background:var(--yel)"></i>隣接</span>
    <span><i class="dot" style="background:var(--sub)"></i>次点強数字</span>
  </div>
  <div class="card"><b>精度メーター</b> <span class="sub" id="mlabel">バックテスト計算中…</span>
    <div class="meter" id="meter"><i style="width:0"></i></div>
    <span class="sub">バー=平均一致数 / 赤線=無作為に選んだ場合(理論値 1.6)</span></div>

  <h2>流れ(直近10回)</h2>
  <div class="card"><svg id="trend" viewBox="0 0 320 130"></svg>
    <p class="sub" id="tnote"></p></div>

  <h2>出現頻度と未出(赤=直近未出)</h2>
  <div class="card"><svg id="freq" viewBox="0 0 330 130"></svg></div>

  <h2>バックテスト(直近200回・各回は直前までのデータで推奨)</h2>
  <div class="card"><table id="bt"></table></div>

  <h2>当選結果の取り込み</h2>
  <div class="card">
    <p class="sub">「回,日付,8数字」を含む行を貼り付け(例: 460,2026-10-15,5,8,14,...)。取得済みの回は無視されます。</p>
    <textarea id="csv" rows="4"></textarea>
    <button id="ibtn">取り込む</button> <span class="sub" id="imsg"></span>
  </div>
  <p class="sub" style="margin-top:24px">当選を保証するものではありません。偏りと流れを見るための分析ツールです。</p>
  <button id="out" style="background:var(--mute);margin-top:8px">ログアウト</button>
</section>
</main>
<script>
const API = 'https://script.google.com/macros/s/AKfycbzdanpZgkfU0HxXUytffsmh7cJ3CzwjtcpoUxiShexJ6sWVGARhQ2j6_RBzaeI5SUbFhA/exec'; // GASのウェブアプリURL
const WIN = 10; // 未出判定の直近回数
const $ = s => document.querySelector(s);
const TL = {stable:'安定',super_stable:'超安定',mid:'中間',reverse:'反転',strong:'強',slide:'スライド',magnet:'磁場'};
const ORDER = [0,1,2,3,'F',4,5,6,7];
let token = localStorage.b5token, mode = localStorage.b5mode || 'balanced', REC, ST, BT;

async function api(action, x = {}) {
  const r = await fetch(API, {method:'POST', body:JSON.stringify({a:action, t:token, window:WIN, ...x})});
  const j = await r.json();
  if (j.err && action !== 'login') { logout(); $('#lerr').textContent = j.err; throw new Error('auth'); }
  return j;
}
function logout(){ localStorage.removeItem('b5token'); token = null; $('#app').hidden = true; $('#login').hidden = false; }

$('#lbtn').onclick = async () => {
  $('#lerr').textContent = '';
  try {
    const j = await api('login', {id:$('#uid').value, pw:$('#upw').value});
    if (j.token) { token = j.token; localStorage.b5token = token; $('#upw').value = ''; start(); }
    else $('#lerr').textContent = j.err || 'ログインできませんでした';
  } catch(e) { $('#lerr').textContent = '接続できません。API のURLを確認してください'; }
};
$('#out').onclick = logout;

async function start() {
  $('#login').hidden = true; $('#app').hidden = false;
  try {
    [REC, ST] = await Promise.all([api('recommend'), api('stats')]);
    if (REC.error || ST.error) { $('#meta').textContent = '履歴がありません。下の「当選結果の取り込み」から追加してください。'; return; }
    renderAll();
    BT = null; renderBT();
    BT = await api('backtest'); renderBT(); renderMeter();
  } catch(e) { if (e.message !== 'auth') $('#meta').textContent = '読み込みに失敗しました。再読み込みしてください'; }
}

function renderAll() {
  $('#title').textContent = `第${REC.next}回 ビンゴ5予報`;
  $('#meta').textContent = `蓄積${ST.count}回 / 最新 第${ST.latest.round}回(${ST.latest.date}) / 流れ: ${REC.trend === 'strong_trend' ? '強数字優勢' : '未出優勢'}${REC.reverse ? ' / 反転シグナルあり' : ''}`;
  document.querySelectorAll('#seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === mode));
  renderBoard(); renderMeter(); renderTrend(); renderFreq();
}
document.querySelectorAll('#seg button').forEach(b => b.onclick = () => { mode = b.dataset.m; localStorage.b5mode = mode; if (REC) renderAll(); });

// ブロック性格マップ(ビンゴ盤面: 0 1 2 / 3 FREE 4 / 5 6 7)
function renderBoard() {
  const list = REC.modes[mode];
  $('#board').innerHTML = ORDER.map(k => k === 'F'
    ? `<div class="free"><b>第${REC.next}回</b><small>${{stable:'安定型',balanced:'バランス型',explosive:'爆発型'}[mode]}</small></div>`
    : (c => `<div class="cell ${c.tag}"><div class="ball">${c.n}</div><small>${k*5+1}〜${k*5+5}</small><small>${TL[c.type]}枠</small></div>`)(list[k])).join('');
}

function renderMeter() {
  if (!BT || BT.error) { if (BT && BT.error) $('#mlabel').textContent = BT.error; return; }
  const m = BT.results.find(r => r.mode === mode), rnd = BT.results.find(r => r.mode === 'random');
  $('#mlabel').textContent = `平均${m.avg_hits.toFixed(2)}個/8(無作為 ${rnd.avg_hits.toFixed(2)})`;
  $('#meter').innerHTML = `<i style="width:${m.avg_hits / 8 * 100}%"></i><u style="left:${1.6 / 8 * 100}%"></u>`;
}

function renderTrend() {
  const s = ST.series, w = 320 / s.length, h = 12;
  $('#trend').innerHTML = s.map((r, i) => {
    const x = i * w + 4;
    return `<rect x="${x}" y="${110 - r.strong * h}" width="${w/2 - 3}" height="${r.strong * h}" fill="var(--blue)"/>`
      + `<rect x="${x + w/2 - 2}" y="${110 - r.missing * h}" width="${w/2 - 3}" height="${r.missing * h}" fill="var(--red)"/>`
      + `<text x="${x + w/2 - 2}" y="124" text-anchor="middle">${r.round}</text>`;
  }).join('');
  $('#tnote').textContent = '青=強数字(頻度上位10)の当選数、赤=その回の直前10回で出ていなかった数字の当選数';
}

function renderFreq() {
  const f = ST.freq, mx = Math.max(...f), missing = new Set(ST.miss.flat());
  $('#freq').innerHTML = f.map((v, i) => {
    const n = i + 1, hh = v / mx * 100, x = 4 + i * 8.1;
    return `<rect x="${x}" y="${108 - hh}" width="6.4" height="${hh}" fill="${missing.has(n) ? 'var(--red)' : 'var(--blue)'}" opacity="${Math.floor(i/5) % 2 ? .55 : 1}"/>`
      + (n % 5 === 0 || n === 1 ? `<text x="${x + 3}" y="122" text-anchor="middle">${n}</text>` : '');
  }).join('');
}

function renderBT() {
  const name = {stable:'安定型',balanced:'バランス型',explosive:'爆発型',random:'無作為'};
  if (!BT) { $('#bt').innerHTML = '<tr><td>計算中…</td></tr>'; return; }
  if (BT.error) { $('#bt').innerHTML = `<tr><td>${BT.error}</td></tr>`; return; }
  $('#bt').innerHTML = '<tr><th>モード</th><th>平均一致</th><th>平均ライン</th><th>1ライン+</th><th>2ライン+</th><th>最大</th></tr>'
    + BT.results.map(r => `<tr><td>${name[r.mode]}</td><td>${r.avg_hits.toFixed(2)}</td><td>${r.avg_lines.toFixed(3)}</td><td>${(r.rate1*100).toFixed(1)}%</td><td>${(r.rate2*100).toFixed(1)}%</td><td>${r.max_lines}</td></tr>`).join('');
}

$('#ibtn').onclick = async () => {
  $('#imsg').textContent = '取り込み中…';
  try {
    const j = await api('import', {text:$('#csv').value});
    $('#imsg').textContent = `${j.added}件追加しました`;
    if (j.added) { $('#csv').value = ''; start(); }
  } catch(e) { $('#imsg').textContent = '失敗しました'; }
};

token ? start() : $('#login').hidden = false;
</script>
</body>
</html>
